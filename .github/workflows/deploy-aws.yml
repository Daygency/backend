# AWS: ECR 푸시 → (선택) ECS 서비스 재배포
# Secrets: AWS_REGION, ECR_REPOSITORY 필수 / OIDC: AWS_ROLE_ARN 또는 액세스 키 2개
name: Deploy AWS

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ecr-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          test -n "$AWS_REGION" || { echo "::error::Secret AWS_REGION is required"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "::error::Secret ECR_REPOSITORY is required"; exit 1; }

      - name: Resolve auth mode
        id: auth
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set AWS_ROLE_ARN (OIDC) or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          echo "IMAGE_TAG=${REGISTRY}/${REPO}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${REGISTRY}/${REPO}:latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve ECS deploy
        id: ecs
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          if [ -n "$ECS_CLUSTER" ] && [ -n "$ECS_SERVICE" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ECS service
        if: steps.ecs.outputs.deploy == 'true'
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION }}"

# -----------------------------------------------------------------------------
# GitHub Secrets (Repository → Settings → Secrets and variables → Actions)
#
# 필수
#   AWS_REGION          예: ap-northeast-2
#   ECR_REPOSITORY      ECR 저장소 이름
#
# 인증 (하나만 설정)
#   [권장] AWS_ROLE_ARN   — IAM 역할 (OIDC: GitHub → AWS 신뢰)
#   [대안] AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#
# 선택 (ECS 사용 시)
#   ECS_CLUSTER
#   ECS_SERVICE
# -----------------------------------------------------------------------------
