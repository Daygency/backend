name: Deploy EC2

on:
  push:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EC2_RESTART_COMMAND: ${{ secrets.EC2_RESTART_COMMAND }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install & build (GitHub 러너 — EC2 에서 빌드 안 함)
        run: |
          npm ci
          npm run build

      - name: Pack
        run: tar czf release.tar.gz dist package.json package-lock.json

      - name: SCP to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: /tmp

      - name: Unpack, prod deps only, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: EC2_RESTART_COMMAND
          script_stop: true
          script: |
            set -e
            if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh"; fi
            if command -v fnm >/dev/null 2>&1; then eval "$(fnm env)"; fi
            command -v npm >/dev/null 2>&1 || { echo "::error::EC2 에 npm 없음"; exit 1; }

            DP="${{ secrets.EC2_DEPLOY_PATH }}"
            DP="${DP//$'\r'/}"
            if [[ "$DP" == \~* ]]; then DP="${DP/#\~/$HOME}"; fi
            if [ -z "$DP" ]; then echo "::error::EC2_DEPLOY_PATH 비어 있음"; exit 1; fi

            mkdir -p "$DP"
            tar xzf /tmp/release.tar.gz -C "$DP"
            rm -f /tmp/release.tar.gz
            cd "$DP"
            # t3.micro 부하 완화: 감사·펀드 스킵, 직렬 설치
            export NODE_OPTIONS=--max-old-space-size=768
            npm ci --omit=dev --no-audit --no-fund

            if [ -n "$EC2_RESTART_COMMAND" ]; then
              echo ">>> restart"
              eval "$EC2_RESTART_COMMAND"
            fi

# Secrets: EC2_HOST, EC2_USER, EC2_SSH_PRIVATE_KEY, EC2_DEPLOY_PATH
# 선택: EC2_RESTART_COMMAND (예: pm2 restart ecosystem.config.js --env production)
# EC2 배포 경로에 .env·Firebase 키 등은 서버에서만 유지 (레포에 넣지 말 것)
