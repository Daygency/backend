# ECR 없이 EC2에 SSH로 접속 → git 동기화 → npm build → (선택) 프로세스 재시작
name: Deploy EC2

on:
  push:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          debug: true
          script: |
            set -e
            # 비로그인 SSH 에서 nvm / fnm 등으로 깐 Node 가 PATH 에 없으면 npm 을 못 찾음
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi
            if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)"
            fi
            command -v git >/dev/null 2>&1 || { echo "::error::EC2 에 git 이 없습니다. sudo apt install -y git"; exit 1; }
            command -v npm >/dev/null 2>&1 || { echo "::error::EC2 에 npm 을 찾을 수 없습니다. Node 설치 또는 nvm default 설정 후 PATH 확인"; exit 1; }

            DEPLOY_PATH="${{ secrets.EC2_DEPLOY_PATH }}"
            if [[ "$DEPLOY_PATH" == \~* ]]; then
              DEPLOY_PATH="${DEPLOY_PATH/#\~/$HOME}"
            fi
            echo "Deploy path: $DEPLOY_PATH"
            echo "Branch: ${{ github.ref_name }}"

            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              if [ -d "$DEPLOY_PATH" ] && [ -n "$(ls -A "$DEPLOY_PATH" 2>/dev/null)" ]; then
                echo "::error::EC2_DEPLOY_PATH 가 이미 있고 비어 있지 않습니다 (.git 없음). 폴더를 비우거나 다른 경로를 쓰세요: $DEPLOY_PATH"
                exit 1
              fi
              mkdir -p "$(dirname "$DEPLOY_PATH")"
              echo ">>> git clone (첫 배포)"
              # --depth 1 --branch 는 원격 브랜치/권한 이슈로 자주 실패 → 전체 클론 후 체크아웃
              git clone "$REPO_URL" "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
              echo ">>> checkout ${{ github.ref_name }}"
              git fetch origin
              git checkout -f "${{ github.ref_name }}"
            else
              echo ">>> 기존 저장소 갱신"
              cd "$DEPLOY_PATH"
              git fetch origin
              git reset --hard "origin/${{ github.ref_name }}"
            fi

            echo ">>> npm ci"
            npm ci
            echo ">>> npm run build"
            npm run build

            if [ -n "${{ secrets.EC2_RESTART_COMMAND }}" ]; then
              echo ">>> restart"
              eval "${{ secrets.EC2_RESTART_COMMAND }}"
            fi

# =============================================================================
# 1) GitHub Repository → Secrets and variables → Actions → Secrets
#    (CI/CD가 EC2에 접속·배포하는 데 필요한 것만)
#
#    EC2_HOST              EC2 퍼블릭 IP 또는 DNS (예: ec2-x-x-x-x.ap-northeast-2.compute.amazonaws.com)
#    EC2_USER              SSH 사용자 (Ubuntu: ubuntu, Amazon Linux: ec2-user 등)
#    EC2_SSH_PRIVATE_KEY   EC2 접속용 개인키 전체 (-----BEGIN ... END----- 포함, 여러 줄)
#    EC2_DEPLOY_PATH       EC2에 둘 경로 (아직 없으면 첫 배포 때 이 이름으로 자동 git clone)
#                          예: ~/backend 또는 /home/ubuntu/backend
#
#    선택
#    EC2_RESTART_COMMAND   빌드 후 한 줄 (예: pm2 restart all). 비우면 빌드만 하고 재시작 안 함
#
#    SSH 포트가 22가 아니면 appleboy/ssh-action 의 port 입력을 워크플로에 추가하거나,
#    Variables 로 EC2_SSH_PORT 를 두고 with.port 에 연결
#
# 2) EC2 서버에만 두는 환경변수 (.env 또는 systemd Environment=)
#    GitHub에 올리지 말 것 (RDS 비밀번호, JWT, AWS 키 등)
#
#    --- RDS / TypeORM (MySQL) ---
#    DATABASE_TYPE=mysql
#    DATABASE_HOST=<RDS 엔드포인트>   예: xxx.xxx.ap-northeast-2.rds.amazonaws.com
#    DATABASE_PORT=3306
#    DATABASE_USERNAME=
#    DATABASE_PASSWORD=
#    DATABASE_NAME=
#
#    --- 앱 공통 ---
#    PORT=3000
#
#    --- JWT (Auth / 채팅 소켓) ---
#    JWT_ACCESS_SECRET=<랜덤 긴 문자열>
#    JWT_REFRESH_SECRET=<선택, 없으면 ACCESS와 동일하게 쓰는 로직 있음>
#
#    --- 파일 업로드(S3) 쓰는 경우 ---
#    AWS_ACCESS_KEY=
#    AWS_SECRET_ACCESS_KEY=
#    AWS_REGION=ap-northeast-2
#    AWS_S3_BUCKET=
#
# 3) EC2 준비
#    - Node 22+, git, npm (git clone 은 워크플로가 GITHUB_TOKEN 으로 자동 수행)
#    - 같은 저장소·같은 Actions 권한이면 Private 이라도 첫 clone 가능 (fork/다른 레포면 PAT 등 별도 필요)
#    - .env 는 EC2에서 직접 만들어 두기 (RDS 등) — 레포에 커밋하지 말 것
#    - RDS 보안 그룹: EC2 에서 RDS 3306 인바운드 허용
# =============================================================================
